name: "📦 Publish"

# リリース (vX.Y.Z) のバイナリを OS ごとに作り、registry.fastship.jp (Cloud Storage の cli/<version>/) に置く。リリースのたびに手動で実行する。
# 公開したバージョンは書き換えない (scripts/upload.sh)。publish のジョブが途中で失敗したときは、そのジョブだけを再実行する
# (PyInstaller のビルドは毎回同じバイナリにならないため、ワークフロー全体をやり直すと公開済みのファイルと食い違って失敗する)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースのタグ (例 v1.2.0)"
        type: string
        required: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: "バージョンを確かめる"
        id: version
        env:
          TAG: ${{ inputs.version }}
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version は vX.Y.Z の形式で指定してください: $TAG"
            exit 1
          fi
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

  # PyInstaller はクロスコンパイルできないので、OS と CPU ごとのランナーで作る
  build:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: macos-15, name: fastship-darwin-arm64 }
          - { runner: macos-15-intel, name: fastship-darwin-x64 }
          # 古い glibc で作ったバイナリは新しい glibc でも動く (逆は動かない) ので、サポート中で最も古い Ubuntu で作る
          - { runner: ubuntu-22.04, name: fastship-linux-x64 }
          - { runner: ubuntu-22.04-arm, name: fastship-linux-arm64 }
          - { runner: windows-2025, name: fastship-windows-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # --copy-metadata は fastship --version (importlib.metadata) のため
      - name: "バイナリを作る"
        run: |
          uv sync --locked
          uv run pyinstaller --onefile --name "${{ matrix.name }}" --copy-metadata fastship src/fastship/__main__.py

      # pyproject.toml の version を上げ忘れたタグを配らない (install.sh は --version で更新するかを決める)
      - name: "バージョンを確かめる"
        env:
          EXPECTED: ${{ needs.version.outputs.number }}
          # Windows では PyInstaller が .exe を付ける
          BIN: dist/${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          actual=$("$BIN" --version | tr -d '\r')
          [ "$actual" = "$EXPECTED" ] || { echo "::error::--version が $actual です (期待 $EXPECTED)"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cli-publish 用 SA は production の Environment を通った main の publish.yml からしか借りられない (registry.fastship.jp の bootstrap の wif.tf)
    environment: production
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation
    steps:
      # スクリプトは main のものを使う
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # インストールスクリプトはリリースのタグのものを配る
      - name: "リリースのタグをチェックアウト"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          path: release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: "インストールスクリプトと SHA256SUMS を揃える"
        run: |
          cp release/install/install.sh release/install/install.ps1 release/install/install.cmd dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.PUBLISH_SERVICE_ACCOUNT_EMAIL }}

      # バイナリとスクリプトを先に置き、SHA256SUMS を最後に置く (registry は SHA256SUMS があるバージョンだけを配る)
      - name: "Cloud Storage にアップロード"
        env:
          BUCKET: ${{ vars.BUCKET }}
          VERSION: ${{ needs.version.outputs.number }}
        run: scripts/upload.sh dist "$VERSION" "$BUCKET"
